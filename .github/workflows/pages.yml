name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p _site/assets/projects _site/assets/stack _site/reviewer-organizer
          cp -- index.html styles.css script.js _site/
          cp -- assets/favicon.svg assets/marvin-avatar.jpg _site/assets/
          cp -- assets/projects/classpulse.webp assets/projects/studynest.webp assets/projects/marvinbuilds.webp assets/projects/marvprox.webp assets/projects/voxmate.webp _site/assets/projects/
          for stack_icon in nextdotjs react typescript vite tailwindcss convex nodedotjs express python vercel codex claude git github docker vitest postgresql supabase mysql sqlite indexeddb; do
            cp -- "assets/stack/$stack_icon.svg" _site/assets/stack/
          done
          cp -- reviewer-organizer/index.html reviewer-organizer/redirect.js reviewer-organizer/sw.js _site/reviewer-organizer/
          touch _site/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
